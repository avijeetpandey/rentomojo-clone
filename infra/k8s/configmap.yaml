apiVersion: v1
kind: ConfigMap
metadata:
  name: rentomojo-config
  namespace: rentomojo
  labels:
    app.kubernetes.io/name: rentomojo
data:
  NODE_ENV: "production"
  PORT: "4000"
  LOG_LEVEL: "info"
  JWT_EXPIRES_IN: "7d"
  CORS_ORIGIN: "https://rentomojo.example.com"
  # The DATABASE_URL is assembled from Secret values at runtime via envFrom + env.
  POSTGRES_DB: "rentomojo"
  POSTGRES_USER: "rentomojo"
  POSTGRES_HOST: "postgres-svc"
  POSTGRES_PORT: "5432"
