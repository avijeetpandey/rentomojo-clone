apiVersion: apps/v1
kind: Deployment
metadata:
  name: rentomojo-backend
  namespace: rentomojo
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: rentomojo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rentomojo-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rentomojo-backend
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: migrate
          # Same image as main container — runs `prisma migrate deploy` before startup.
          image: ghcr.io/your-org/rentomojo-backend:latest
          imagePullPolicy: Always
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?schema=public"
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: POSTGRES_USER
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rentomojo-secret
                  key: POSTGRES_PASSWORD
      containers:
        - name: backend
          # Replace with your registry image after `podman build -t registry/rentomojo-backend:latest ./backend`
          image: ghcr.io/your-org/rentomojo-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: LOG_LEVEL
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: JWT_EXPIRES_IN
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: CORS_ORIGIN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rentomojo-secret
                  key: JWT_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rentomojo-secret
                  key: POSTGRES_PASSWORD
            # Assemble DATABASE_URL from ConfigMap host/user/db + Secret password.
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?schema=public"
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: POSTGRES_USER
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: rentomojo-config
                  key: POSTGRES_DB
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
